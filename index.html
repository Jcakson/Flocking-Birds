<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>群鸟共舞 · 涌现模拟</title><style>
*{box-sizing:border-box}body{margin:0;background:#e9edf0;color:#202c36;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.app{max-width:1500px;margin:auto;padding:25px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;margin-bottom:18px}.eyebrow{font-size:11px;letter-spacing:3px;color:#74818b;font-weight:700}.top h1{font-size:clamp(25px,3vw,37px);font-weight:650;letter-spacing:-1.3px;margin:7px 0}.top p{margin:0;color:#71808c;font-size:13px}.status{font-size:12px;color:#64747d;display:flex;gap:10px;align-items:center}.dot{width:7px;height:7px;background:#4e947f;border-radius:50%;box-shadow:0 0 0 4px #d5e7e0}.layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px}.scene{position:relative;border-radius:18px;overflow:hidden;background:#d5e2e8;min-height:550px;box-shadow:0 5px 30px #263f4c0d}.scene canvas{width:100%;height:100%;display:block;position:absolute;inset:0;touch-action:pan-y}.scene:after{content:"";pointer-events:none;position:absolute;inset:0;border:1px solid #ffffff70;border-radius:18px}.overlay{position:absolute;top:21px;left:24px;pointer-events:none}.overlay .label{font-size:10px;letter-spacing:2px;font-weight:700;color:#566e7d}.overlay .big{font-size:13px;color:#536b79;margin-top:5px}.hint{position:absolute;bottom:20px;left:24px;font-size:11px;color:#607885;pointer-events:none}.panel{background:#f8fafb;border:1px solid #ffffff;border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:19px}.panel h2{font-size:15px;font-weight:650;margin:0}.sub{color:#87939a;font-size:12px;line-height:1.65;margin-top:5px}.control{display:grid;gap:8px}.control label{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:#52616b}.control output{font-weight:700;color:#253f4b;font-variant-numeric:tabular-nums}input[type=range]{width:100%;accent-color:#496d7b;cursor:pointer}button{border:0;border-radius:10px;padding:12px 13px;font-size:12px;font-weight:650;cursor:pointer;min-height:42px}button.primary{background:#273e49;color:white;flex:1}button.secondary{background:#e7edef;color:#425963;flex:1}.actions{display:flex;gap:8px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#edf2f4;border-radius:10px;padding:12px}.stat small{display:block;font-size:10px;color:#84929a}.stat strong{display:block;font-size:22px;font-weight:650;margin-top:5px;letter-spacing:-.6px}.foot{font-size:11px;line-height:1.65;color:#7c8a92;border-top:1px solid #e6ecee;padding-top:13px}@media(max-width:800px){.app{padding:14px}.layout{grid-template-columns:1fr}.scene{min-height:430px}.panel{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.panel>.intro,.panel>.actions,.panel>.stats,.panel>.foot{grid-column:1/-1}}@media(max-width:440px){.scene{min-height:340px}.panel{grid-template-columns:1fr}.panel>*{grid-column:1/-1}}
</style></head><body><main class="app"><header class="top"><div><div class="eyebrow">EMERGENCE / 001</div><h1>群鸟共舞 <span style="font-weight:350;color:#84949c">/ 涌现</span></h1><p>没有指挥者，却能形成令人惊叹的集体秩序。</p></div><div class="status"><span class="dot"></span><span id="state">实时模拟中</span></div></header><div class="layout"><section class="scene" id="scene"><canvas id="sky" aria-label="数百只鸟在天空中实时聚集和盘旋的交互动画"></canvas><div class="overlay"><div class="label">MURMURATION STUDY</div><div class="big">椋鸟群飞 · 自组织系统</div></div><div class="hint">移动鼠标驱散鸟群 · 点击产生扰动</div></section><aside class="panel"><div class="intro"><h2>行为实验室</h2><div class="sub">改变每只鸟的局部行为，观察整个鸟群如何形成新的运动形态。</div></div><div class="control"><label for="count">鸟群数量 <output id="countO">432</output></label><input id="count" type="range" min="100" max="1000" step="20" value="440"></div><div class="control"><label for="sep">分离 · 避免碰撞 <output id="sepO">1.5</output></label><input id="sep" type="range" min="0" max="3" step="0.1" value="1.5"></div><div class="control"><label for="ali">对齐 · 方向一致 <output id="aliO">1.9</output></label><input id="ali" type="range" min="0" max="3" step="0.1" value="1.9"></div><div class="control"><label for="coh">凝聚 · 靠近同伴 <output id="cohO">1.5</output></label><input id="coh" type="range" min="0" max="3" step="0.1" value="1.5"></div><div class="control"><label for="speed">飞行速度 <output id="speedO">2.6</output></label><input id="speed" type="range" min="1" max="5" step="0.1" value="2.6"></div><div class="actions"><button id="pause" class="primary">Ⅱ 暂停</button><button id="restart" class="secondary">↻ 重新生成</button></div><div class="stats"><div class="stat"><small>当前鸟群</small><strong id="birdsN">432</strong></div><div class="stat"><small>方向一致性</small><strong id="order">—</strong></div></div><div class="foot">Boids 群体行为模型 · Craig Reynolds (1987)<br>三条简单规则，可以产生复杂而优美的集体飞行。</div></aside></div></main><script>
(()=>{'use strict';const root=document.querySelector('.app');if(root.dataset.ready)return;root.dataset.ready='1';const $=id=>document.getElementById(id),canvas=$('sky'),ctx=canvas.getContext('2d'),scene=$('scene');let W=900,H=550,D=1,flock=[],running=true,last=0,frame=0,raf=0;const mouse={x:-1000,y:-1000,active:false,burst:0};const random=(a,b)=>a+Math.random()*(b-a);const read=id=>Number($(id).value);function resize(){const r=scene.getBoundingClientRect();W=Math.max(280,r.width);H=Math.max(300,r.height);D=Math.min(2,window.devicePixelRatio||1);canvas.width=Math.round(W*D);canvas.height=Math.round(H*D);ctx.setTransform(D,0,0,D,0,0)}function newBird(i){const a=random(0,Math.PI*2),spread=Math.min(W,H)*.29;return{x:W/2+random(-spread,spread),y:H/2+random(-spread,spread),vx:Math.cos(a)*random(1.3,2.8),vy:Math.sin(a)*random(1.3,2.8),phase:random(0,6.28),size:random(2.4,4.6),shade:Math.floor(random(0,3))}}function reset(){const n=read('count');flock=Array.from({length:n},(_,i)=>newBird(i));$('birdsN').textContent=n;$('countO').textContent=n;frame=0}function clampVector(x,y,m){const d=Math.hypot(x,y);return d>m?{x:x/d*m,y:y/d*m}:{x,y}}function step(){const n=flock.length,cell=65,grid=new Map();for(let i=0;i<n;i++){const b=flock[i],key=Math.floor(b.x/cell)+','+Math.floor(b.y/cell);if(!grid.has(key))grid.set(key,[]);grid.get(key).push(i)}const max=read('speed'),sep=read('sep'),ali=read('ali'),coh=read('coh');let vxsum=0,vysum=0;for(let i=0;i<n;i++){const b=flock[i],gx=Math.floor(b.x/cell),gy=Math.floor(b.y/cell);let sx=0,sy=0,ax=0,ay=0,cx=0,cy=0,k=0;for(let xx=-1;xx<=1;xx++)for(let yy=-1;yy<=1;yy++){const ids=grid.get((gx+xx)+','+(gy+yy));if(!ids)continue;for(const j of ids){if(i===j)continue;const o=flock[j],dx=o.x-b.x,dy=o.y-b.y,d2=dx*dx+dy*dy;if(d2>4900||d2<.001)continue;k++;ax+=o.vx;ay+=o.vy;cx+=dx;cy+=dy;if(d2<500){sx-=dx/d2*80;sy-=dy/d2*80}}}let fx=0,fy=0;if(k){const s=clampVector(sx,sy,.09),a=clampVector(ax/k-b.vx,ay/k-b.vy,.08),c=clampVector(cx/k,cy/k,.055);fx=s.x*sep+a.x*ali+c.x*coh;fy=s.y*sep+a.y*ali+c.y*coh}const dx=b.x-mouse.x,dy=b.y-mouse.y,d2=dx*dx+dy*dy;if(mouse.active&&d2<18000&&d2>1){const f=mouse.burst?1.3:.38;fx+=dx/Math.sqrt(d2)*f;fy+=dy/Math.sqrt(d2)*f}const margin=95;if(b.x<margin)fx+=(margin-b.x)/margin*.11;if(b.x>W-margin)fx-=(b.x-(W-margin))/margin*.11;if(b.y<margin)fy+=(margin-b.y)/margin*.11;if(b.y>H-margin)fy-=(b.y-(H-margin))/margin*.11;b.vx+=Math.max(-.2,Math.min(.2,fx));b.vy+=Math.max(-.2,Math.min(.2,fy));const mag=Math.hypot(b.vx,b.vy)||1;b.vx=b.vx/mag*max;b.vy=b.vy/mag*max;b.x+=b.vx;b.y+=b.vy;if(b.x<-20)b.x=W+20;if(b.x>W+20)b.x=-20;if(b.y<-20)b.y=H+20;if(b.y>H+20)b.y=-20;vxsum+=b.vx/max;vysum+=b.vy/max;b.phase+=.21+max*.022}if(mouse.burst)mouse.burst--;frame++;if(frame%12===0)$('order').textContent=Math.round(Math.hypot(vxsum,vysum)/n*100)+'%'}function paint(){const g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'#e3edf0');g.addColorStop(.5,'#cddce2');g.addColorStop(1,'#b9ccd4');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);const halo=ctx.createRadialGradient(W*.72,H*.2,0,W*.72,H*.2,W*.65);halo.addColorStop(0,'rgba(255,255,255,.53)');halo.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=halo;ctx.fillRect(0,0,W,H);for(const b of flock){const ang=Math.atan2(b.vy,b.vx);const wing=Math.sin(b.phase),span=b.size*(1.9+.5*wing);ctx.save();ctx.translate(b.x,b.y);ctx.rotate(ang);ctx.strokeStyle=b.shade===0?'rgba(30,48,57,.87)':b.shade===1?'rgba(46,62,72,.75)':'rgba(20,40,49,.92)';ctx.lineWidth=Math.max(.85,b.size*.35);ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(b.size*.9,0);ctx.lineTo(-b.size*.4,0);ctx.moveTo(b.size*.3,0);ctx.quadraticCurveTo(-b.size*.2,-span*.15,-b.size*.65,-span);ctx.moveTo(b.size*.3,0);ctx.quadraticCurveTo(-b.size*.2,span*.15,-b.size*.65,span);ctx.stroke();ctx.restore()}}function tick(t){if(!document.contains(canvas)){cancelAnimationFrame(raf);return}if(running&&t-last>=15){step();paint();last=t}raf=requestAnimationFrame(tick)}for(const id of ['sep','ali','coh','speed','count']){$(id).addEventListener('input',()=>{$(id+'O').textContent=read(id).toFixed(id==='count'?0:1);if(id==='count')reset()})}$('count').value=432;$('countO').textContent='432';$('pause').addEventListener('click',()=>{running=!running;$('pause').textContent=running?'Ⅱ 暂停':'▶ 继续';$('state').textContent=running?'实时模拟中':'已暂停'});$('restart').addEventListener('click',()=>{reset();paint()});canvas.addEventListener('pointermove',e=>{const r=canvas.getBoundingClientRect();mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top;mouse.active=true});canvas.addEventListener('pointerleave',()=>mouse.active=false);canvas.addEventListener('pointerdown',e=>{const r=canvas.getBoundingClientRect();mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top;mouse.active=true;mouse.burst=22});window.addEventListener('resize',()=>{resize();paint()});resize();reset();paint();if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches){running=false;$('pause').textContent='▶ 继续';$('state').textContent='已暂停'}raf=requestAnimationFrame(tick)})();
</script></body></html>
